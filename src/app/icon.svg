<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A24"/>
      <stop offset="50%" stop-color="#0F0F14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS Squircle Glass Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="8"/>

  <!-- Subtle Specular Glass Sheen Overlay -->
  <path d="M 0 0 L 512 0 C 512 180 320 280 0 240 Z" fill="rgba(255, 255, 255, 0.07)"/>

  <!-- Golden Durga Trishul & Umaa Emblem -->
  <g filter="url(#glow)">
    <!-- Center Trishul Spear -->
    <path d="M 256 90 L 278 200 L 256 185 L 234 200 Z" fill="url(#goldGrad)"/>
    <path d="M 256 185 L 256 360" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Left Trishul Prong -->
    <path d="M 256 270 C 190 270 170 190 170 140 C 180 180 200 230 256 240" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Right Trishul Prong -->
    <path d="M 256 270 C 322 270 342 190 342 140 C 332 180 312 230 256 240" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Sacred Third Eye / Bindi -->
    <ellipse cx="256" cy="220" rx="9" ry="14" fill="#E63946"/>

    <!-- Base Crescent / Lotus Aura -->
    <path d="M 200 360 C 230 385 282 385 312 360" fill="none" stroke="url(#mintGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Umaa Sparkle Accent Dots -->
    <circle cx="256" cy="410" r="8" fill="url(#mintGrad)"/>
  </g>
</svg>
